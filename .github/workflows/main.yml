name: Generate Config

on:
  schedule:
    - cron: '0 * * * *'        # каждый час
  workflow_dispatch:            # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # чтобы Actions мог коммитить и пушить

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dnspython requests

      - name: Run Generator
        run: python generator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "action@github.com"
          git add ShadowVoice_Live.conf direct.txt proxy.txt domains_cache.json
          if git diff --cached --quiet; then
            echo "✅ Изменений нет, пропускаем коммит."
          else
            git commit -m "Auto-update: refresh config and cache $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Изменения запушены в репозиторий."
          fi
