[General]
bypass-system = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
dns-server = system, https://1.1.1.1/dns-query, https://dns.google/dns-query
dns-direct-system = true
dns-direct-received = true
dns-fallback-system = true
dns-direct-fallback-proxy = true
