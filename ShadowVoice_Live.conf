(?<=&mcc_mnc=)460[0-9]{2}(?=&) 310260 307
(^https?://\w+-tiktok\.amemv\.com/opt/v1/list.+) REJECT
(^https?://\w+\.tiktokv\.com/aweme/v1/feed.+) header_replace "X-Tt-Token" ""

[MITM]
