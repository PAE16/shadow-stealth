#!name=ShadowVoice_Auto_Update
#!desc=Обновляемый конфиг с защитой от детекта.

[General]
bypass-system = true
ipv6 = false
prefer-ipv6 = false
tun-excluded-routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, 100.64.0.0/10
dns-server = https://1.1.1.2/dns-query, system
dns-direct-system = true

[Rule]
# --- СТАТИЧЕСКИЕ ПРАВИЛА ЭКОСИСТЕМЫ APPLE ---
DOMAIN,facetime.apple.com,PROXY
DOMAIN,imessage.apple.com,PROXY
DOMAIN,push.apple.com,PROXY
DOMAIN-SUFFIX,icloud.com,PROXY
DOMAIN-SUFFIX,apple-cloudkit.com,PROXY

# --- СТАТИЧЕСКИЕ ПРАВИЛА СКРЫТНОСТИ ДЛЯ РФ ---
DOMAIN-SUFFIX,gosuslugi.ru,DIRECT,no-resolve
DOMAIN-SUFFIX,tbank.ru,DIRECT,no-resolve
DOMAIN-SUFFIX,sberbank.ru,DIRECT,no-resolve

# {DYNAMIC_RULES_PLACEHOLDER}

# --- ФИНАЛЬНЫЙ WHITELIST ---
GEOIP,RU,DIRECT
FINAL,PROXY
